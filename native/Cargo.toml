[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "ao-listen"
version = "0.1.0"
edition = "2021"
description = "Node addon wrapping the listen crate for Ao's main process"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "ao_listen"
crate-type = ["cdylib", "rlib"]

[dependencies]
ao-listen-core = { path = "core" }
listen = { path = "/home/namal/code/listen" }
napi = { version = "2.16", default-features = false, features = ["napi8"] }
napi-derive = "2.16"

[build-dependencies]
napi-build = "2"
